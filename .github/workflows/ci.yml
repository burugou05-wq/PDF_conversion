name: Test and Windows build
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt -r requirements-optional.txt
      - run: python -m ruff check .
      - run: python -m pytest -q --junitxml=pytest-results.xml
      - name: Annotate pytest failures
        if: failure()
        run: python scripts/report_pytest_failures.py pytest-results.xml
      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.os }}-${{ matrix.python }}
          path: pytest-results.xml
          if-no-files-found: warn
  windows-build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build EXE
        run: |
          python build.py 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Annotate build failure
        if: failure()
        run: python scripts/report_build_failure.py build.log
      - name: Upload Windows build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log
          path: build.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: ImageToPDF-Windows
          path: dist/*.exe
  release:
    if: github.ref == 'refs/tags/v2.0.1'
    needs: windows-build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ImageToPDF-Windows
          path: release
      - name: Prepare release assets
        run: |
          cp "release/画像PDF変換ツール.exe" "release/ImageToPDF-${GITHUB_REF_NAME}-Windows-x64.exe"
          cd release
          sha256sum "ImageToPDF-${GITHUB_REF_NAME}-Windows-x64.exe" > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "release/ImageToPDF-${GITHUB_REF_NAME}-Windows-x64.exe" \
            release/SHA256SUMS.txt \
            --verify-tag \
            --repo "$GITHUB_REPOSITORY" \
            --title "v2.0.1 — 色プロファイルとDPI情報をより正確に扱う" \
            --notes "ICCプロファイルを持つ画像の色を正しく扱い、プレビューとCLIでICC情報・DPIの取得元を確認できるようにしました。DPI情報がない場合の既定値（初期値96dpi）も変更できます。詳細は https://github.com/burugou05-wq/PDF_conversion/blob/v2.0.1/CHANGELOG.md をご覧ください。"
