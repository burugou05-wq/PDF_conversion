name: Test and Windows release builds

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned to full commit SHAs so a compromised tag cannot change
# what CI executes. Dependabot opens pull requests that move these pins.
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt -r requirements-optional.txt
      - run: python -m ruff check .
      - run: python -m pytest -q --junitxml=pytest-results.xml
      - name: Annotate pytest failures
        if: failure()
        run: python scripts/report_pytest_failures.py pytest-results.xml
      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-results-${{ matrix.os }}-${{ matrix.python }}
          path: pytest-results.xml
          if-no-files-found: warn

  winui-build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'
      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2.0.0
      - name: Build single-file WinUI release
        shell: pwsh
        run: .\build_winui.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ImageToPDF-WinUI-Release
          path: |
            dist/ImageToPDF-Setup-v*-Windows-x64.exe
            dist/SHA256SUMS.txt
            dist/LICENSE
            dist/THIRD_PARTY_NOTICES.md
          if-no-files-found: error

  # Publishing is only possible from a version tag push. workflow_dispatch and
  # pull requests can still build/test, but they can never touch a release.
  # Configure the "release" environment with required reviewers before tagging.
  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: winui-build
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: publish-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Determine release tag from the application version
        id: release-tag
        shell: bash
        run: |
          # The tag always comes from app_config.py, so typed inputs cannot change it.
          version="$(python -c 'from app_config import VERSION; print(VERSION)')"
          tag="v$version"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Pushed tag $GITHUB_REF_NAME does not match app version $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ImageToPDF-WinUI-Release
          path: release-assets
      - name: Refuse to modify an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release-tag.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to modify assets" >&2
            exit 1
          fi
      - name: Sign SHA256SUMS.txt (ECDSA P-256)
        env:
          RELEASE_SIGNING_KEY_B64: ${{ secrets.RELEASE_SIGNING_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release-tag.outputs.tag }}"
          if [[ -z "$RELEASE_SIGNING_KEY_B64" ]]; then
            echo "::error::release environment secret RELEASE_SIGNING_KEY_B64 is not set" >&2
            exit 1
          fi
          test -f release-assets/SHA256SUMS.txt
          compgen -G 'release-assets/ImageToPDF-Setup-*.exe' >/dev/null
          # Windows ビルドは LF で書き出しますが、念のため CR を除いて照合します。
          grep -Fxq "# tag: $tag" <(tr -d '\r' < release-assets/SHA256SUMS.txt) || {
            echo "SHA256SUMS.txt does not declare tag $tag" >&2
            exit 1
          }
          key="$RUNNER_TEMP/release-p256.key"
          ( umask 077; printf '%s' "$RELEASE_SIGNING_KEY_B64" | base64 --decode > "$key" )
          python scripts/release_signing.py check --private-key "$key"
          python scripts/release_signing.py sign \
            --private-key "$key" \
            --checksums release-assets/SHA256SUMS.txt \
            --output release-assets/SHA256SUMS.txt.sig
          rm -f "$key"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/ImageToPDF-Setup-*.exe
            release-assets/SHA256SUMS.txt
      - name: Publish (immutable)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release-tag.outputs.tag }}"
          # The release page body is the matching CHANGELOG.md section.
          awk -v heading="## $tag " 'index($0, heading) == 1 { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > release-notes.md
          title="$(grep -m1 "^## $tag " CHANGELOG.md | sed 's/^## //' || true)"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to modify assets" >&2
            exit 1
          fi
          # --verify-tag keeps the release pinned to the tag that triggered CI,
          # not to a tag that gh would create from the default branch.
          gh release create "$tag" release-assets/* \
            --target "$GITHUB_SHA" --verify-tag \
            --title "${title:-$tag}" --notes-file release-notes.md
