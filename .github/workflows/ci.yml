name: Test and Windows release builds

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional version tag to publish or update after a manual build"
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt -r requirements-optional.txt
      - run: python -m ruff check .
      - run: python -m pytest -q --junitxml=pytest-results.xml
      - name: Annotate pytest failures
        if: failure()
        run: python scripts/report_pytest_failures.py pytest-results.xml
      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.os }}-${{ matrix.python }}
          path: pytest-results.xml
          if-no-files-found: warn

  winui-build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: microsoft/setup-msbuild@v2
      - name: Build single-file WinUI release
        shell: pwsh
        run: .\build_winui.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ImageToPDF-WinUI-Release
          path: |
            dist/ImageToPDF-v*-Windows-x64.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

  publish-release:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: winui-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify tag and application version match
        id: release-tag
        env:
          REQUESTED_TAG: ${{ github.event.inputs.release_tag || '' }}
        shell: bash
        run: |
          tag="${REQUESTED_TAG:-$GITHUB_REF_NAME}"
          version="$(python -c 'from app_config import VERSION; print(VERSION)')"
          if [[ "$tag" != "v$version" ]]; then
            echo "Tag $tag does not match app version v$version" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: ImageToPDF-WinUI-Release
          path: release-assets
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ steps.release-tag.outputs.tag }}"
          # The release page body is the matching CHANGELOG.md section.
          awk -v heading="## $tag " 'index($0, heading) == 1 { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > release-notes.md
          title="$(grep -m1 "^## $tag " CHANGELOG.md | sed 's/^## //')"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
          else
            # Pin the tag to the commit that was built, not the default branch head.
            gh release create "$tag" release-assets/* --target "$GITHUB_SHA" --title "${title:-$tag}" --notes-file release-notes.md
          fi
