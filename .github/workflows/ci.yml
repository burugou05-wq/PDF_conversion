name: Test and Windows release builds

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional version tag to publish or update after a manual build"
        required: false
        type: string

permissions:
  contents: read

# Actions are pinned to full commit SHAs so a compromised tag cannot change
# what CI executes. Dependabot opens pull requests that move these pins.
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt -r requirements-optional.txt
      - run: python -m ruff check .
      - run: python -m pytest -q

  winui-build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'
      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2.0.0
      - name: Build self-contained WinUI preview package
        shell: pwsh
        run: .\build_winui.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ImageToPDF-WinUI-Preview
          path: |
            dist/ImageToPDF-v*-Windows-x64-WinUI-Portable.zip
            dist/SHA256SUMS-WinUI.txt
          if-no-files-found: error

  windows-build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python build.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ImageToPDF-Windows
          path: |
            dist/ImageToPDF-v*-Windows-x64.exe
            dist/ImageToPDF-v*-Windows-x64-Portable.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  publish-release:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: windows-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Verify tag and application version match
        id: release-tag
        env:
          REQUESTED_TAG: ${{ github.event.inputs.release_tag || '' }}
        shell: bash
        run: |
          tag="${REQUESTED_TAG:-$GITHUB_REF_NAME}"
          version="$(python -c 'from app_config import VERSION; print(VERSION)')"
          if [[ "$tag" != "v$version" ]]; then
            echo "Tag $tag does not match app version v$version" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ImageToPDF-Windows
          path: release-assets
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ steps.release-tag.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
          else
            gh release create "$tag" release-assets/* --title "$tag" --generate-notes
          fi
